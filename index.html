<!DOCTYPE html>
<html>

<head>
    <title>Mi primera página</title>
     <link rel="stylesheet" href="estilos.css">
</head>

<body>
   <div class="tarjeta">
    <h1>Hola, soy Matias</h1>
    <img src="foto.jpg.png" alt="Mi foto" class="foto-perfil">
    <p>Estoy aprendiendo desarrollo web y me encataria aprender muchisisimo mas!.</p>

<h2>Sobre mí</h2>
<ul id="listaHabilidades"><u1></u1>
<input type="text" id="nuevaHabilidad" placeholder="Nueva habilidad">
<button id="btnAgregar">Agregar</button>
</ul>

<a href="https://www.google.com">Mi sitio favorito</a>
<button id="btnSaludo">Salúdame</button>
<p id="mensaje"></p>
<button id="btnContador">Clic aquí</button>
<p id="contador">Has hecho clic 0 veces</p>
<h2>Contáctame</h2>
<form id="formContacto">
  <label for="nombre">Nombre:</label><br>
  <input type="text" id="nombre" placeholder="Tu nombre"><br><br>

  <label for="correo">Correo:</label><br>
  <input type="email" id="correo" placeholder="tu@correo.com"><br><br>

  <label for="mensajeUsuario">Mensaje:</label><br>
  <textarea id="mensajeUsuario" placeholder="Escribe tu mensaje..."></textarea><br><br>

  <button type="submit">Enviar</button>
</form>
<p id="resultadoForm"></p>

</div> 

<script src="script.js"></script>
</body>

</html>
